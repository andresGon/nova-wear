<header class="app-header">
  <div class="logo-container">
    <a routerLink="/products" (click)="closeMobileMenu()">
      <img src="assets/images/nova-wear.png" alt="Nova Wear" height="40">
    </a>
  </div>

  <!-- Hamburger Menu Button (Visible on Mobile) -->
  <button class="menu-toggle" (click)="toggleMobileMenu()" aria-label="Toggle menu">
    ☰ <!-- Or use an SVG icon -->
  </button>

  <!-- Navigation Container (Adapts for Mobile) -->
  <nav class="category-nav" [class.mobile-menu-open]="isMobileMenuOpen">
    <!-- Optional: Overlay for when mobile menu is open
    <div class="menu-overlay" (click)="closeMobileMenu()"></div> -->

    <!-- Category List (Styled differently on mobile) -->
    <div *ngIf="isLoading" class="loading-wrap__categories">
      <p>Loading categories...</p>
      <div class="spinner"></div>
    </div>
    <div *ngIf="error" style="color: red;">{{ error }}</div>
    <ul *ngIf="!isLoading && !error">
      <li>
        <a
          routerLink="/products"
          routerLinkActive="active-category"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMobileMenu()"
                     >All</a>
      </li>
      <li *ngFor="let category of categories">
        <a
          [routerLink]="['/category', category]"
          routerLinkActive="active-category"
          (click)="closeMobileMenu()" 
          >{{ category | titlecase }}</a
        >
      </li>
    </ul>
  </nav>
</header>
