<header class="app-header">
  <div class="logo-container">
    <!-- Placeholder for Logo -->
    <a routerLink="/products"> <!-- Change routerLink from /home to /products -->
      <img src="assets/logo-placeholder.png" alt="Nova Wear Logo" height="40">
      <!-- Replace with your actual logo later -->
    </a>
  </div>

  <nav class="category-nav">
    <div *ngIf="isLoading">Loading categories...</div>
    <div *ngIf="error" style="color: red;">{{ error }}</div>
    <ul *ngIf="!isLoading && !error">
      <!-- Link to all products -->
      <li><a routerLink="/products">All Products</a></li>
      <!-- Links for each category using the new route -->
      <li *ngFor="let category of categories">
        <a [routerLink]="['/category', category]">{{ category | titlecase }}</a>
      </li>
    </ul>
  </nav>
</header>
