<header class="app-header">
  <div class="logo-container">
    <!-- Placeholder for Logo -->
    <a routerLink="/products"> 
      <img src="assets/images/nova-wear.png" alt="Nova Wear" height="40">
    </a>
  </div>

  <nav class="category-nav">
    <div *ngIf="isLoading">Loading categories...</div>
    <div *ngIf="error" style="color: red;">{{ error }}</div>
    <ul *ngIf="!isLoading && !error">
      <!-- Add routerLinkActive and options for exact match on 'All' -->
      <li>
        <a
          routerLink="/products"
          routerLinkActive="active-category"
          [routerLinkActiveOptions]="{ exact: true }"
          >All</a
        >
      </li>
      <!-- Add routerLinkActive for category links -->
      <li *ngFor="let category of categories">
        <a
          [routerLink]="['/category', category]"
          routerLinkActive="active-category"
          >{{ category | titlecase }}</a
        >
      </li>
    </ul>
  </nav>
</header>
