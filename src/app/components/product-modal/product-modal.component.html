<div class="modal-overlay" (click)="onOverlayClick($event)">
  <div class="modal-content">
    <!-- Close button -->
    <button class="close-button" (click)="close()">&times;</button> <!-- Changed onClose() to close() -->

    <!-- Product Details -->
    <div *ngIf="product">
      <h2>{{ product.title }}</h2>
      <img [src]="product.image" [alt]="product.title" class="modal-image">
      <p>{{ product.description }}</p>
      <p><strong>Price:</strong> {{ product.price | currency }}</p>
      <p><strong>Category:</strong> {{ product.category | titlecase }}</p>
      <p *ngIf="product.rating">
        <strong>Rating:</strong> {{ product.rating.rate }}/5 ({{ product.rating.count }} reviews)
      </p>
    </div>
  </div>
</div>
