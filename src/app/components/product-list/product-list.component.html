<h2>{{ currentCategory ? (currentCategory | titlecase) : 'All Products' }}</h2>

<div *ngIf="isLoading">
  <p>Loading products...</p>
</div>

<div *ngIf="error" style="color: red;">
  <p>{{ error }}</p>
</div>

<div *ngIf="!isLoading && !error && products.length > 0" class="product-grid">
  <!-- Add (click) event to the product card div -->
  <div *ngFor="let product of products" class="product-card" (click)="openProductModal(product)">
    <img [src]="product.image" [alt]="product.title" width="100">
    <h3>{{ product.title }}</h3>
    <p>{{ product.price | currency }}</p>
  </div>
</div>

<div *ngIf="!isLoading && !error && products.length === 0">
  <p>No products found{{ currentCategory ? ' in this category' : '' }}.</p>
</div>

<!-- Add the modal component -->
<app-product-modal
  *ngIf="isModalVisible"
  [product]="selectedProduct"
  (closeModal)="closeProductModal()">
</app-product-modal>
