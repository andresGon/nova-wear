<div *ngIf="isLoading">
  <p>Loading products...</p>
</div>

<div *ngIf="error" style="color: red;">
  <p>{{ error }}</p>
</div>

<!-- Make sure this *ngIf checks !isLoading and !error -->
<div *ngIf="!isLoading && !error && products.length > 0" class="product-grid">
   <!-- Check if products array actually has items -->
  <div *ngFor="let product of products" class="product-card">
    <img [src]="product.image" [alt]="product.title" width="100">
    <h3>{{ product.title }}</h3>
    <p>{{ product.price | currency }}</p>
  </div>
</div>

<!-- Add a message if products array is empty after loading -->
<div *ngIf="!isLoading && !error && products.length === 0">
  <p>No products found.</p>
</div>
